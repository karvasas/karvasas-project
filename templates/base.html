<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Service Desk{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-subtle: #f1f5f9;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --success: #059669;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --radius: 8px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .mono { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }

        /* Top Navbar */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .topbar-inner {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .nav-left { display: flex; align-items: center; gap: 24px; }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
            text-decoration: none !important;
        }
        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #0f172a;
            color: #fff;
            display: grid;
            place-items: center;
        }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        .nav-link {
            padding: 6px 12px;
            border-radius: 6px;
            color: var(--text-muted);
            font-weight: 500;
            text-decoration: none !important;
            transition: all 0.15s;
        }
        .nav-link:hover { background: var(--surface-subtle); color: var(--text); }
        .nav-link.active { background: #eff6ff; color: var(--primary); font-weight: 600; }

        /* User Switcher */
        .user-switcher { display: flex; align-items: center; gap: 8px; }
        .role-tag {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 3px 7px;
            border-radius: 5px;
            background: var(--surface-subtle);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .role-tag.agent, .role-tag.admin { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }

        /* Layout */
        .container { max-width: 1240px; margin: 0 auto; padding: 24px 20px 48px; }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .page-title { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
        .page-subtitle { margin: 2px 0 0; color: var(--text-muted); font-size: 13px; }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
        }
        .card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-body { padding: 18px; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 34px;
            padding: 0 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            text-decoration: none !important;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { background: var(--surface-subtle); }
        .btn-primary, .btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover, .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
        .btn.contrast {
            background: #059669;
            border-color: #059669;
            color: #ffffff;
        }
        .btn.contrast:hover { background: #047857; }
        .btn.secondary { background: var(--surface); color: var(--text); }
        .btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; }

        /* Inputs */
        input[type="text"], input[type="search"], select, textarea {
            width: 100%;
            font-family: inherit;
            font-size: 13px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 7px 11px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input[type="text"], input[type="search"], select { height: 34px; }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        label.field-label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .status-new { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
        .status-in_progress { background: #fffbeb; color: #b45309; border-color: #fde68a; }
        .status-waiting_user { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
        .status-resolved { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
        .status-closed { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }

        .prio-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .prio-low { background: #94a3b8; }
        .prio-medium { background: #3b82f6; }
        .prio-high { background: #f97316; }
        .prio-critical { background: #dc2626; }

        .badge-overdue {
            background: var(--danger-bg);
            color: var(--danger);
            border-color: var(--danger-border);
            font-weight: 600;
        }
        .badge-ok {
            background: var(--success-bg);
            color: var(--success);
            border-color: var(--success-border);
        }

        /* Alerts */
        .alert {
            padding: 11px 14px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-success { background: var(--success-bg); color: #065f46; border: 1px solid var(--success-border); }
        .alert-error { background: var(--danger-bg); color: #991b1b; border: 1px solid var(--danger-border); }

        /* Tables */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f8fafc; }

        .avatar-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .avatar-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #334155;
            font-size: 11px;
            font-weight: 600;
            display: inline-grid;
            place-items: center;
            flex-shrink: 0;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="nav-left">
                <a href="/" class="brand">
                    <span class="brand-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </span>
                    <span>IT Service Desk</span>
                </a>
                <nav class="nav-links">
                    <a href="/" class="nav-link {% if request.url.path == '/' or request.url.path == '/tickets' %}active{% endif %}">Заявки</a>
                    <a href="/stats" class="nav-link {% if request.url.path == '/stats' %}active{% endif %}">Аналитика и SLA</a>
                </nav>
            </div>

            <div class="user-switcher">
                <span class="role-tag {{ current_user.role }}">{{ current_user.role }}</span>
                <form action="/switch-user" method="post" style="margin: 0;">
                    <select name="user_id" onchange="this.form.submit()" aria-label="Текущий пользователь" style="width: auto; min-width: 240px;">
                        {% for u in all_users %}
                        <option value="{{ u.id }}" {% if u.id == current_user.id %}selected{% endif %}>
                            {{ u.full_name }}
                        </option>
                        {% endfor %}
                    </select>
                </form>
            </div>
        </div>
    </header>

    <main class="container">
        {% if msg %}
        <div class="alert alert-success">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>
            <span>{{ msg }}</span>
        </div>
        {% endif %}
        {% if error %}
        <div class="alert alert-error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
