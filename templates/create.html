{% extends "base.html" %}
{% block title %}Новая заявка — IT Service Desk{% endblock %}

{% block head %}
<style>
    .form-wrap { max-width: 760px; margin: 0 auto; }
    .form-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .file-box {
        border: 1px dashed var(--border-strong);
        background: #f8fafc;
        border-radius: 6px;
        padding: 14px;
    }
    @media (max-width: 700px) { .form-row-3 { grid-template-columns: 1fr; } }
</style>
{% endblock %}

{% block content %}
<div class="form-wrap">
    <div class="page-header">
        <div>
            <h1 class="page-title">Регистрация обращения</h1>
            <p class="page-subtitle">Срок реагирования SLA рассчитывается автоматически по выбранному приоритету</p>
        </div>
        <a href="/" class="btn">Назад к списку</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form action="/tickets/create" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label class="field-label">Тема обращения <span style="color: var(--danger);">*</span></label>
                    <input type="text" name="title" required value="{{ form_data.get('title', '') }}" placeholder="Кратко опишите суть проблемы">
                </div>

                <div class="form-row-3">
                    <div>
                        <label class="field-label">Категория</label>
                        <select name="category">
                            {% for cat in categories %}
                            <option value="{{ cat }}" {% if form_data.get('category') == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="field-label">Приоритет (SLA)</label>
                        <select name="priority">
                            {% for key, meta in priorities.items() %}
                            <option value="{{ key }}" {% if form_data.get('priority', 'medium') == key %}selected{% endif %}>
                                {{ meta.label }} ({{ meta.sla_hours }} ч.)
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="field-label">Исполнитель</label>
                        <select name="assignee_id">
                            <option value="">Назначить позже</option>
                            {% for a in agents %}
                            <option value="{{ a.id }}" {% if form_data.get('assignee_id') == a.id|string %}selected{% endif %}>{{ a.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="field-label">Подробное описание <span style="color: var(--danger);">*</span></label>
                    <textarea name="description" rows="6" required placeholder="Укажите текст ошибки, адрес рабочего места или шаги воспроизведения...">{{ form_data.get('description', '') }}</textarea>
                </div>

                <div class="form-group">
                    <label class="field-label">Вложения (скриншоты, логи, документы)</label>
                    <div class="file-box">
                        <input type="file" name="files" multiple style="font-size: 13px;">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 8px; border-top: 1px solid var(--border);">
                    <a href="/" class="btn">Отмена</a>
                    <button type="submit" class="btn btn-primary">Создать заявку</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
